# Render.com Blueprint for the FRAME backend.
# Deploy: connect this repo in the Render dashboard → "New +" → "Blueprint"
# → point it at this file. Render will read the env var names below and
# prompt you to fill in the actual values; none are set here.
#
# Why Render (or another long-running Node host) instead of serverless:
# this server keeps an in-memory TTL cache for TMDB responses and an
# in-memory rate limiter — both reset on every cold start and don't share
# state across concurrent invocations, which defeats their purpose on a
# serverless platform. Prisma's connection pool also behaves far better
# against a long-lived process than against bursty serverless invocations.
# Railway, Fly.io, or a plain VPS work equally well under the same model.

services:
  - type: web
    name: frame-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: TMDB_API_READ_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
